name: Phase 12 Release Readiness Gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-phase12:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Install exact declared dependencies
        run: npm install --no-audit --no-fund

      - name: Verify resolved core versions
        run: npm ls three @dimforge/rapier3d-compat vite typescript

      - name: Run Phase 12 gate
        run: npm run verify:phase12

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: orbital-scrapper-phase12-release
          path: release/orbital-scrapper-web
          if-no-files-found: error

      - name: Upload performance evidence
        uses: actions/upload-artifact@v4
        with:
          name: orbital-scrapper-phase12-performance
          path: performance-evidence/phase12-ci-capture.json
          if-no-files-found: error
